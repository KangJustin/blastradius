[project]
name = "blastradius"
version = "0.1.0"
description = "Blast Radius Analyzer - visualize the impact of changing a function"
entry-point = "main.jac"
kind = "fullstack"
jac-version = "==0.34.7"

[dependencies]

[dev-dependencies]
watchdog = ">=3.0.0"

[dependencies.npm]

[dependencies.npm.dev]
tailwindcss = "latest"
"@tailwindcss/vite" = "latest"
"@vitejs/plugin-react" = "^4.0.0"

[byllm.model]
default_model = "claude-sonnet-4-6"

[test]
directory = "."
verbose = true

[plugins.client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[serve]
base_route_app = "app"

[jac-shadcn]
style = "lyra"
baseColor = "zinc"
theme = "indigo"
font = "geist"
radius = "small"
menuAccent = "subtle"

[jacpack]
name = 'blastradius'
description = 'Jac IDE snapshot for blastradius'
